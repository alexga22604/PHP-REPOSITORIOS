<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Jugador</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Courier New", Courier, monospace;
        background: #9a9ab5;
        margin: 0;
        padding: 20px;
      }

      h1 {
        text-align: center;
      }

      form {
        background: #fff;
        max-width: 500px;
        margin: 0 auto;
        padding: 18px;
        border-radius: 12px;
      }

      label {
        font-weight: bold;
      }

      .campo {
        margin-bottom: 16px;
      }
      .campo > label {
        display: block;
        margin-bottom: 6px;
      }

      input[type="text"],
      input[type="number"],
      input[type="file"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 0.9rem;
      }

      fieldset {
        border: 1px solid #ddd;
        margin: 0 0 20px 0;
        padding: 8px 12px;
      }

      fieldset label {
        display: block;
        margin: 4px 0;
      }

      input[type="checkbox"],
      input[type="radio"] {
        accent-color: #e8501e;
      }

      .error {
        display: block;
        margin-top: 6px;
        color: #c00;
        font-size: 0.85rem;
      }

      .botones button {
        background: #007bff;
        color: #fff;
        border: 0;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Formulario de Jugador</h1>

    <form
      id="formJugador"
      action="index.php"
      method="post"
      enctype="multipart/form-data"
    >
      <div class="campo">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" maxlength="50" required />
      </div>

      <div class="campo">
        <label for="alias">Alias:</label>
        <input type="text" id="alias" name="alias" maxlength="50" required />
      </div>

      <div class="campo">
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" min="0" max="120" required />
      </div>

      <fieldset>
        <legend>Armas a elegir (puedes elegir varias):</legend>
        <label
          ><input type="checkbox" name="armas[]" value="Maza" /> Maza</label
        >
        <label
          ><input type="checkbox" name="armas[]" value="Antorcha" />
          Antorcha</label
        >
        <label
          ><input type="checkbox" name="armas[]" value="Martillo" />
          Martillo</label
        >
        <label
          ><input type="checkbox" name="armas[]" value="Látigo" /> Látigo</label
        >
      </fieldset>

      <fieldset>
        <legend>¿Practica artes mágicas?</legend>
        <label
          ><input type="radio" name="magia" value="Sí" required /> Sí</label
        >
        <label><input type="radio" name="magia" value="No" /> No</label>
      </fieldset>

      <div class="campo">
        <label for="imagen">Subir imagen:</label>
        <input type="hidden" name="MAX_FILE_SIZE" value="30720" />
        <input type="file" id="imagen" name="imagen" accept="image/png" />
        <span id="errorImagen" class="error"></span>
      </div>

      <div class="botones">
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
      </div>
    </form>

    <script>
      const MAX_BYTES = 30 * 1024;

      const form = document.getElementById("formJugador");
      const inputImagen = document.getElementById("imagen");
      const errorImagen = document.getElementById("errorImagen");

      function validarImagen() {
        const archivo = inputImagen.files[0];
        let mensaje = "";

        if (archivo) {
          if (archivo.type !== "image/png") {
            mensaje = "Solo se permiten archivos PNG.";
          } else if (archivo.size > MAX_BYTES) {
            mensaje =
              "La imagen no puede superar los 30 KB (la tuya pesa " +
              (archivo.size / 1024).toFixed(1) +
              " KB).";
          }
        }

        errorImagen.textContent = mensaje;
        inputImagen.setCustomValidity(mensaje);
      }

      inputImagen.addEventListener("change", validarImagen);

      form.addEventListener("submit", function (evento) {
        validarImagen();

        if (!form.checkValidity()) {
          evento.preventDefault();
          form.reportValidity();
        }
      });

      form.addEventListener("reset", function () {
        errorImagen.textContent = "";
        inputImagen.setCustomValidity("");
      });
    </script>
  </body>
</html>
